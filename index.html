<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宋梦宋梦宇宙第一</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f8c8dc;
    min-height:100vh;
}
.wrapper{
    width:100vw;
    position:relative;
    /* 原图比例 宽960，高2092 */
    aspect-ratio: 960 / 2092;
    background:url("bg.png");
    background-size:100% 100%;
    background-repeat:no-repeat;
}
/* 热区，百分比会跟随wrapper自动缩放 */
.box-1{
    position:absolute;
    top:35%;
    left:4%;
    width:92%;
    height:20%;
}
.box-2{
    position:absolute;
    top:48%;
    left:4%;
    width:52%;
    height:26%;
}
.box-3{
    position:absolute;
    top:74%;
    left:4%;
    width:42%;
    height:24%;
}
.box-4{
    position:absolute;
    top:52%;
    left:56%;
    width:40%;
    height:46%;
}
a{
    display:block;
    width:100%;
    height:100%;
    /* 加半透明红色，调试的时候打开看点击区域，上线后删掉 */
    /* background:rgba(255,0,0,0.2); */
}
</style>
</head>
<body>
<div class="wrapper">
    <!-- 第一个框可点击，跳转到转盘wheel.html -->
    <div class="box-1">
        <a href="wheel.html"></a>
    </div>
    <!-- 剩下三个无链接，点不动 -->
    <div class="box-2"></div>
    <div class="box-3"></div>
    <div class="box-4"></div>
</div>
</body>
</html>
